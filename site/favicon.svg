<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b19eef" />
            <stop offset="50%" stop-color="#8a2be2" />
            <stop offset="100%" stop-color="#4b0082" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Squircle background representing tech and modern styling -->
    <rect x="32" y="32" width="448" height="448" rx="128" fill="#0a0a0c" stroke="url(#purple-gradient)" stroke-width="16" />
    
    <!-- Stylized modern Monogram letters 'RK' -->
    <g transform="translate(48, 12) scale(0.82)" filter="url(#glow)">
        <!-- Letter R -->
        <path d="M 120, 100 L 120, 380 M 120, 100 L 220, 100 C 280, 100 280, 240 120, 240 M 180, 240 L 280, 380" 
              fill="none" stroke="url(#purple-gradient)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Letter K -->
        <path d="M 360, 100 L 360, 380 M 480, 100 L 360, 240 M 360, 240 L 480, 380" 
              fill="none" stroke="url(#purple-gradient)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    </g>
</svg>
